<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Save Data - Z Fitness</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-P0JBRSCYFF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-P0JBRSCYFF');
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAbcluHlCBt5acY5qBwjJgjbSYk7EgeT90",
    authDomain: "z-fitness-a.firebaseapp.com",
    projectId: "z-fitness-a",
    storageBucket: "z-fitness-a.firebasestorage.app",
    messagingSenderId: "289896498711",
    appId: "1:289896498711:web:6bc6943dcfb06cca2d7e52",
    measurementId: "G-G8BVVRSCXH",
    databaseURL: "https://z-fitness-a-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  window.db = database;
  window.dbRef = ref;
  window.dbSet = set;
  window.dbUpdate = update;
  window.dbOnValue = onValue;

  // Auto-fill existing data from Firebase
  const userName = localStorage.getItem("name");
  if (userName) {
    const profileRef = ref(database, `users/${userName}/profile`);
    onValue(profileRef, (snap) => {
      const data = snap.val();
      if (data) {
        if(data.age) document.getElementById("age").value = data.age;
        if(data.gender) document.getElementById("gender").value = data.gender;
        if(data.weight) document.getElementById("weight").value = data.weight;
        if(data.height) document.getElementById("height").value = data.height;
        if(data.goal) document.getElementById("goal").value = data.goal;
        if(data.workoutLevel) document.getElementById("workout").value = data.workoutLevel;
        if(data.dietType) document.getElementById("diet").value = data.dietType;
        if(data.calorie) document.getElementById("calorie").value = data.calorie;
      }
    });
  }
</script>

<style>
:root{ --bg:#eef3f8; --card:#ffffffcc; --border:#d7e0ea; --accent:#007bff; --accent2:#00b894; --text:#1c1c1c; }
body{ margin:0; font-family:'Poppins',Arial,sans-serif; background:var(--bg); color:var(--text); }
*,button,a{transition:0.25s;}

header{ height:60px; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; position:fixed; top:0; left:0; right:0; background:blue; color:white; z-index:10; }
.menu-btn{ position:absolute; left:14px; font-size:26px; background:none; border:none; cursor:pointer; color:white; }

.sidebar{ width:250px; background:#ffffffee; position:fixed; top:0; bottom:0; left:-260px; padding-top:75px; border-right:1px solid var(--border); transition:.35s; backdrop-filter:blur(10px); z-index:20; }
.sidebar.open{left:0;}
.sidebar a{ display:flex; align-items:center; padding:16px 22px; font-size:17px; text-decoration:none; color:var(--text); border-bottom:1px solid #f1f4f6; }
.sidebar a:hover{background:#f8fffd; color:var(--accent); padding-left:28px;}

.main{ position:absolute; top:65px; bottom:65px; left:0; right:0; overflow-y:auto; padding:18px; }
.card{ background:white; padding:15px; border-radius:12px; margin-bottom:15px; box-shadow:0 3px 10px rgba(0,0,0,.08); border: 1px solid var(--border); }
h3{ margin-top:0; color: var(--accent); font-size: 18px; }

input,select{ width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid var(--border); font-size:14px; box-sizing: border-box; outline: none; }
input:focus, select:focus{ border-color: var(--accent); }

.save-btn{ width:100%; padding:14px; background:var(--accent2); color:white; font-weight:700; border:none; border-radius:10px; font-size:16px; cursor:pointer; margin-top:10px; box-shadow: 0 4px 6px rgba(0,184,148,0.2); }
.save-btn:active{ transform: scale(0.98); }

.bottom{ height:60px; position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-around; align-items:center; background:#ffffffcc; border-top:1px solid var(--border); backdrop-filter: blur(10px); }
.bottom button{ background:none; border:none; font-size:12px; display:flex; flex-direction:column; align-items:center; opacity:.6; cursor:pointer; font-weight:600; color: #555; }
.bottom button span{font-size:22px;}

.overlay{ position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); display:none; z-index:15; backdrop-filter: blur(2px); }
.overlay.show{display:block;}
</style>
</head>

<body>

<header>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>👤Profile Details  


</header>

<div id="sidebar" class="sidebar">
  <a href="index.html">🏠 Dashboard</a>
  <a href="workouts.html">🔥 Workouts</a>
  <a href="diet.html">🥗 Diet Plans</a>
  <a href="fit tools.html">📋 Fit Tools</a>
  <a href="habit traker.html">♾️ Habit Tracker</a>
  <a href="progress.html">📊 Progress Tracker</a>
  <a href="profile.html">👤 Profile</a>
  <a href="settings.html">⚙️ Settings</a>
</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div class="main">
  <div class="card">
    <h3>👤 Profile Details</h3>
    <input type="number" id="age" placeholder="Age">
    <select id="gender">
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>
    <input type="number" id="weight" placeholder="Weight (kg)">
    <input type="number" id="height" placeholder="Height (cm)">
    <select id="goal">
      <option value="Goal">Select Goal</option>
      <option value="Weight Loss">Weight Loss</option>
      <option value="Muscle Gain">Muscle Gain</option>
      <option value="Fitness">Fitness</option>
    </select>
    <select id="workout">
      <option value="Workout Level">Workout Level</option>
      <option value="Beginner">Beginner</option>
      <option value="Intermediate">Intermediate</option>
      <option value="Advanced">Advanced</option>
    </select>
    <select id="diet">
      <option value="Diet Type">Diet Type</option>
      <option value="Veg">Veg</option>
      <option value="Non-Veg">Non-Veg</option>
      <option value="Mixed">Mixed</option>
    </select>
    <input type="number" id="calorie" placeholder="Daily Calorie Target (kcal)">
    <button class="save-btn" onclick="saveProfile()">💾 Save / Update Profile</button>
  </div>
</div>

<div class="bottom">
  <button onclick="location.href='index.html'"><span>🏠</span>Home</button>
  <button onclick="location.href='workouts.html'"><span>🔥</span>Workout</button>
  <button onclick="location.href='diet.html'"><span>🥗</span>Diet</button>
  <button onclick="location.href='profile.html'"><span>👤</span>Profile</button>
</div>

<script>
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

function toggleMenu(){
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
}

const userName = localStorage.getItem("name") || "Guest";

// Profile Logic
async function saveProfile(){
  const data = {
    age: document.getElementById("age").value,
    gender: document.getElementById("gender").value,
    weight: document.getElementById("weight").value,
    height: document.getElementById("height").value,
    goal: document.getElementById("goal").value,
    workoutLevel: document.getElementById("workout").value,
    dietType: document.getElementById("diet").value,
    calorie: document.getElementById("calorie").value,
    lastUpdated: new Date().toISOString()
  };

  if(window.db) {
    try {
      await window.dbUpdate(window.dbRef(window.db, `users/${userName}/profile`), data);
      alert("✅ Profile Details Updated!");
    } catch (e) {
      alert("❌ Sync Failed! Please check internet.");
    }
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Save Data - Z Fitness</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAbcluHlCBt5acY5qBwjJgjbSYk7EgeT90",
    authDomain: "z-fitness-a.firebaseapp.com",
    projectId: "z-fitness-a",
    storageBucket: "z-fitness-a.firebasestorage.app",
    messagingSenderId: "289896498711",
    appId: "1:289896498711:web:6bc6943dcfb06cca2d7e52",
    measurementId: "G-G8BVVRSCXH",
    databaseURL: "https://z-fitness-a-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  window.db = database;
  window.dbRef = ref;
  window.dbSet = set;
  window.dbUpdate = update;
  window.dbOnValue = onValue;

  // லோடிங் தொடக்கம்
  initApp();
</script>

<style>
:root{
  --bg:#eef3f8; --card:#ffffff; --border:#d7e0ea;
  --accent:#007bff; --accent2:#00b894; --text:#1c1c1c;
}

body{ margin:0; font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text); }
header{ height:60px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; position:fixed; top:0; left:0; right:0; background:blue; color:white; z-index:10; }
.menu-btn{ position:absolute; left:14px; font-size:26px; background:none; border:none; color:white; cursor:pointer; }

.sidebar{ width:250px; background:#fff; position:fixed; top:0; bottom:0; left:-260px; padding-top:75px; border-right:1px solid var(--border); transition:.35s; z-index:20; }
.sidebar.open{ left:0; }
.sidebar a{ display:block; padding:15px 20px; text-decoration:none; color:var(--text); border-bottom:1px solid #eee; }

.main{ position:absolute; top:65px; bottom:65px; left:0; right:0; overflow-y:auto; padding:15px; }
.card{ background:white; padding:15px; border-radius:12px; margin-bottom:15px; box-shadow:0 3px 10px rgba(0,0,0,.08); }
input, select{ width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid var(--border); box-sizing: border-box; }

/* Status & Save Buttons */
.status-box{ display:flex; justify-content:space-between; margin:10px 0; }
.status-box button{ width:31%; padding:15px; font-size:20px; border:none; border-radius:8px; cursor:pointer; opacity: 0.4; }
.yes{ background:#00b894; } .medium{ background:#f1c40f; } .no{ background:#ff4757; }

.save-btn{ width:100%; padding:15px; background:var(--accent2); color:white; font-weight:700; border:none; border-radius:10px; cursor:pointer; margin-top:10px; }
.save-btn.loading { background: #6c757d !important; }
.save-btn.error { background: #ff4757 !important; }
.save-btn.success { background: #28a745 !important; }

.overlay{ position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); display:none; z-index:15; }
.overlay.show{ display:block; }
#syncText { text-align: center; color: var(--accent); font-size: 13px; margin-bottom: 10px; }
</style>
</head>

<body>

<header>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  📥 Save Fitness Data
</header>

<div id="sidebar" class="sidebar">
  <a href="index.html">🏠 Dashboard</a>
  <a href="workouts.html">🔥 Workouts</a>
  <a href="diet.html">🥗 Diet Plans</a>
  <a href="habit traker.html">♾️ Habit Tracker</a>
  <a href="profile.html">👤 Profile</a>
</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div class="main">
  <div id="syncText">☁️ Cloud-டன் இணைக்கப்படுகிறது...</div>
  
  <div class="card">
    <h3>👤 Profile Details</h3>
    <input type="number" id="age" placeholder="Age">
    <select id="gender">
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
    <input type="number" id="weight" placeholder="Weight (kg)">
    <input type="number" id="height" placeholder="Height (cm)">
    <select id="goal">
      <option value="">Goal</option>
      <option value="Weight Loss">Weight Loss</option>
      <option value="Muscle Gain">Muscle Gain</option>
      <option value="Fitness">Fitness</option>
    </select>
    <input type="number" id="calorie" placeholder="Your Calorie (kcal)">
    <button class="save-btn" id="profileBtn" onclick="saveProfile()">💾 Save Profile</button>
  </div>

  <div class="card">
    <h3>🏋️ Today Workout?</h3>
    <div class="status-box">
      <button class="yes" id="btnYes" onclick="setTempStatus('✅ Done')">✅</button>
      <button class="medium" id="btnMed" onclick="setTempStatus('🟡 Medium')">🟡</button>
      <button class="no" id="btnNo" onclick="setTempStatus('❌ Missed')">❌</button>
    </div>
    <button class="save-btn" id="todayBtn" onclick="saveTodayStatus()">💾 Save Today Status</button>
  </div>
</div>

<script>
const userName = localStorage.getItem("name") || "Guest";
let todayStatus = "";

function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

// 1. Receive Data (Cloud-லிருந்து தகவல்களைப் பெறுதல்)
function initApp() {
    if(window.db && userName !== "Guest") {
        const profileRef = window.dbRef(window.db, 'users/' + userName + '/profile');
        window.dbOnValue(profileRef, (snapshot) => {
            const data = snapshot.val();
            if(data) {
                document.getElementById("age").value = data.age || "";
                document.getElementById("gender").value = data.gender || "";
                document.getElementById("weight").value = data.weight || "";
                document.getElementById("height").value = data.height || "";
                document.getElementById("goal").value = data.goal || "";
                document.getElementById("calorie").value = data.calorie || "";
            }
            document.getElementById("syncText").innerText = "✅ Cloud Sync Active";
        });
    }
}

// 2. Profile சேமித்தல் (With Network Check)
async function saveProfile(){
  const btn = document.getElementById("profileBtn");
  const profileData = {
    age: document.getElementById("age").value,
    gender: document.getElementById("gender").value,
    weight: document.getElementById("weight").value,
    height: document.getElementById("height").value,
    goal: document.getElementById("goal").value,
    calorie: document.getElementById("calorie").value,
    lastUpdated: new Date().toISOString()
  };

  btn.disabled = true;
  btn.innerText = "⏳ Saving...";
  btn.className = "save-btn loading";

  const timer = setTimeout(() => {
    btn.innerText = "❌ Not Stored (No Tower)";
    btn.className = "save-btn error";
    setTimeout(() => resetBtn(btn, "💾 Save Profile"), 3000);
  }, 10000);

  try {
    await window.dbUpdate(window.dbRef(window.db, 'users/' + userName + '/profile'), profileData);
    clearTimeout(timer);
    btn.innerText = "✅ Profile Saved!";
    btn.className = "save-btn success";
    setTimeout(() => resetBtn(btn, "💾 Save Profile"), 2000);
  } catch (e) {
    clearTimeout(timer);
    btn.innerText = "❌ Error";
    btn.className = "save-btn error";
    setTimeout(() => resetBtn(btn, "💾 Save Profile"), 3000);
  }
}

// 3. Today Status (With Network Check)
function setTempStatus(val){ 
    todayStatus = val;
    document.querySelectorAll('.status-box button').forEach(b => b.style.opacity = '0.3');
    if(val.includes('✅')) document.getElementById('btnYes').style.opacity = '1';
    if(val.includes('🟡')) document.getElementById('btnMed').style.opacity = '1';
    if(val.includes('❌')) document.getElementById('btnNo').style.opacity = '1';
}

async function saveTodayStatus(){
  if(!todayStatus){ alert("Status-ஐ தேர்ந்தெடுக்கவும்!"); return; }
  
  const btn = document.getElementById("todayBtn");
  const date = new Date();
  const day = date.getDate();
  const monthYear = (date.getMonth() + 1) + "_" + date.getFullYear();

  btn.disabled = true;
  btn.innerText = "⏳ Saving...";
  btn.className = "save-btn loading";

  const timer = setTimeout(() => {
    btn.innerText = "❌ Not Stored";
    btn.className = "save-btn error";
    setTimeout(() => resetBtn(btn, "💾 Save Today Status"), 3000);
  }, 10000);

  try {
    const workoutRef = window.dbRef(window.db, 'users/' + userName + '/logs/' + monthYear + '/' + day);
    await window.dbSet(workoutRef, { status: todayStatus, time: new Date().toLocaleTimeString() });
    clearTimeout(timer);
    btn.innerText = "✅ Today Saved!";
    btn.className = "save-btn success";
    setTimeout(() => resetBtn(btn, "💾 Save Today Status"), 2000);
  } catch (e) {
    clearTimeout(timer);
    btn.innerText = "❌ Sync Failed";
    btn.className = "save-btn error";
    setTimeout(() => resetBtn(btn, "💾 Save Today Status"), 3000);
  }
}

function resetBtn(btn, originalText) {
    btn.disabled = false;
    btn.innerText = originalText;
    btn.className = "save-btn";
}
</script>
</body>
</html>

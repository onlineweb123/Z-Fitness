<body>

<header>
  <h1> My Personal Diet Plan </h1>
  <p> Daily Diet Food </p>
</header>

<main>

  <!-- 🥗 Diet List (Add ஆனது மேல வரும்) -->
  <div id="dietContainer"></div>

  <!-- ⚙️ Control System கீழே -->
  <div class="control-panel">
    <h2>🎯 Personal Diet System - புதிய Diet Plan சேர்க்க</h2>
    <input type="text" id="dietName" class="input-box" placeholder="Diet பெயரை எழுதுங்கள்">
    <textarea id="dietDetails" placeholder="Diet விவரங்களை இங்கே எழுதுங்கள்..."></textarea>
    <button id="addBtn" onclick="addDiet()">சேர்</button>
  </div>

</main>



<script>
let diets = JSON.parse(localStorage.getItem("dietPlans")) || [];

function saveData(){
  localStorage.setItem("dietPlans", JSON.stringify(diets));
}

function addDiet(){
  const name = document.getElementById("dietName").value.trim();
  const details = document.getElementById("dietDetails").value.trim();

  if(!name){ alert("Diet பெயரை எழுதுங்கள்!"); return; }
  if(!details){ alert("Diet விவரங்களை எழுதுங்கள்!"); return; }

  diets.unshift({name, details}); // புதியது மேல வர
  document.getElementById("dietName").value = "";
  document.getElementById("dietDetails").value = "";
  saveData();
  renderDiets();
}

function deleteDiet(index){
  if(confirm(`"${diets[index].name}" என்ற Diet-ஐ நீக்க விரும்புகிறீர்களா?`)){
    diets.splice(index,1);
    saveData();
    renderDiets();
  }
}

function toggleContent(i){
  const box = document.querySelector(`#diet_${i}`);
  const btn = document.querySelector(`#btn_${i}`);
  const show = box.style.display === "block";
  box.style.display = show ? "none" : "block";
  btn.textContent = show ? `🍽️ ${diets[i].name} open` : `❌ ${diets[i].name} close`;
}

function renderDiets(){
  const container = document.getElementById("dietContainer");
  container.innerHTML = "";
  diets.forEach((diet, i) => {
    const btn = document.createElement("button");
    btn.className = "toggle-button";
    btn.id = `btn_${i}`;
    btn.textContent = `🍽️ ${diet.name} open`;
    btn.onclick = () => toggleContent(i);

    const box = document.createElement("div");
    box.className = "content-box";
    box.id = `diet_${i}`;
    box.innerHTML = `
      <h3>${diet.name} <button class="delete-btn" onclick="deleteDiet(${i})">🗑️ Delete</button></h3>
      <p>${diet.details.replace(/\n/g, "<br>")}</p>
    `;
    container.appendChild(btn);
    container.appendChild(box);
  });
}

renderDiets();
</script>

</body>

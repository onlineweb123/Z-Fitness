<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Admin Panel</title>

<style>
:root{
  --bg:#eef3f8;
  --card:#ffffffcc;
  --border:#d7e0ea;
  --accent:#007bff;
  --accent2:#009f7b;
  --text:#1c1c1c;
  --blur:blur(18px);
}

body{
  margin:0;
  font-family:'Poppins',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
*,button,a{transition:0.25s;}

header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:700;
  position:fixed;
  top:0;left:0;right:0;
  background:blue;
  backdrop-filter:var(--blur);
  border-bottom:1px solid var(--border);
  z-index:10;
  color:white;
}
.menu-btn{
  position:absolute;
  left:14px;
  font-size:26px;
  background:none;
  border:none;
  cursor:pointer;
  color:white;
}

.sidebar{
  width:250px;
  background:#ffffffdd;
  backdrop-filter:var(--blur);
  position:fixed;
  top:0;bottom:0;left:-260px;
  padding-top:75px;
  border-right:1px solid var(--border);
  z-index:20;
}
.sidebar.open{left:0;}
.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 22px;
  font-size:17px;
  color:var(--text);
  text-decoration:none;
  border-bottom:1px solid #f1f4f6;
  font-weight:500;
}
.sidebar a:hover{
  background:#f8fffd;
  color:var(--accent);
  padding-left:28px;
}

.overlay{
  position:fixed;
  inset:0;
  background:#0006;
  display:none;
  z-index:15;
}
.overlay.show{display:block;}

.main{
  position:absolute;
  top:65px;bottom:65px;left:0;right:0;
  overflow-y:auto;
  padding:18px;
}

/* Workout Card */
.work-card{
  background:var(--card);
  padding:18px;
  border-radius:16px;
  margin-bottom:12px;
  border:1px solid var(--border);
  box-shadow:0 6px 14px rgba(0,0,0,.08);
  cursor:pointer;
}
.work-card:hover{
  transform:scale(1.02);
  border-color:var(--accent);
}
.work-card h3{
  margin:0;
  font-size:18px;
  font-weight:700;
}
.work-card p{
  margin:5px 0 0;
  font-size:14px;
  opacity:.7;
}

.section-title{
  font-size:17px;
  font-weight:700;
  margin:16px 0 8px;
}

/* Bottom Nav */
.bottom{
  height:60px;
  position:fixed;
  bottom:0;left:0;right:0;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:#ffffffcc;
  border-top:1px solid var(--border);
}
.bottom button{
  background:none;
  border:none;
  font-size:13px;
  display:flex;
  flex-direction:column;
  align-items:center;
  opacity:.6;
  cursor:pointer;
  font-weight:600;
}
.bottom button.active,
.bottom button:hover{
  opacity:1;
  color:var(--accent);
  transform:scale(1.1);
}
.bottom button span{
  font-size:22px;
}
</style>
</head>


<body>

<header>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  Admin Panel
</header>

<div id="sidebar" class="sidebar">
  <a href="index.html">🏠 Dashboard</a>
  <a href="workouts.html">🔥 Workouts</a>
  <a href="diet.html">🥗 Diet Plans</a>
</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div class="main">


  <div class="work-card" onclick="location.href='login membership List.html'">
    <h3>Membership list </h3>
    <p>login payment membership list </p>
  </div>

  <div class="work-card" onclick="location.href='ct.html'">
    <h3> Extra Tools </h3>
    <p>Extra Tools And Admin</p>
  </div>


  </div>

</div>

<div class="bottom">
  <button onclick="location.href='index.html'"><span>🏠</span>Home</button>
  <button class="active" onclick="location.href='workouts.html'"><span>🔥</span>Workout</button>
  <button onclick="location.href='diet.html'"><span>🥗</span>Diet</button>

</div>

<script>
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}


function shareApp(){
    if (navigator.share) {
        navigator.share({
            title: "Z Fitness",
            text: "Check out this Fitness App!",
            url: "https://onlineweb123.github.io/Z-Fitness/"
        })
        .catch(err => console.log("Share cancelled"));
    } else {
        alert("Your device does not support sharing.");
    }
}

</script>

</body>
</html>

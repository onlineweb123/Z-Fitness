<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Admin Panel</title>

<style>
:root{
  --bg:#eef3f8;
  --card:#ffffffcc;
  --border:#d7e0ea;
  --accent:#007bff;
  --accent2:#009f7b;
  --text:#1c1c1c;
  --blur:blur(18px);
}

body{
  margin:0;
  font-family:'Poppins',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* --- Login Styles --- */
#loginOverlay {
  position: fixed;
  inset: 0;
  background: #1e293b;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
.login-card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  text-align: center;
  width: 85%;
  max-width: 320px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.login-card h2 { margin-bottom: 20px; font-size: 20px; color: #1e293b; }
.login-card input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  box-sizing: border-box;
}
.login-card button {
  width: 100%;
  padding: 12px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* Initially hide main content */
#mainApp { display: none; }

header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:700;
  position:fixed;
  top:0;left:0;right:0;
  background:blue;
  backdrop-filter:var(--blur);
  border-bottom:1px solid var(--border);
  z-index:10;
  color:white;
}
.menu-btn{
  position:absolute;
  left:14px;
  font-size:26px;
  background:none;
  border:none;
  cursor:pointer;
  color:white;
}

.sidebar{
  width:250px;
  background:#ffffffdd;
  backdrop-filter:var(--blur);
  position:fixed;
  top:0;bottom:0;left:-260px;
  padding-top:75px;
  border-right:1px solid var(--border);
  z-index:20;
}
.sidebar.open{left:0;}
.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 22px;
  font-size:17px;
  color:var(--text);
  text-decoration:none;
  border-bottom:1px solid #f1f4f6;
  font-weight:500;
}
.sidebar a:hover{
  background:#f8fffd;
  color:var(--accent);
  padding-left:28px;
}

.overlay{
  position:fixed;
  inset:0;
  background:#0006;
  display:none;
  z-index:15;
}
.overlay.show{display:block;}

.main{
  position:absolute;
  top:65px;bottom:65px;left:0;right:0;
  overflow-y:auto;
  padding:18px;
}

.work-card{
  background:var(--card);
  padding:18px;
  border-radius:16px;
  margin-bottom:12px;
  border:1px solid var(--border);
  box-shadow:0 6px 14px rgba(0,0,0,.08);
  cursor:pointer;
}
.work-card:hover{
  transform:scale(1.02);
  border-color:var(--accent);
}
.work-card h3{ margin:0; font-size:18px; font-weight:700; }
.work-card p{ margin:5px 0 0; font-size:14px; opacity:.7; }

.bottom{
  height:60px;
  position:fixed;
  bottom:0;left:0;right:0;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:#ffffffcc;
  border-top:1px solid var(--border);
}
.bottom button{
  background:none;
  border:none;
  font-size:13px;
  display:flex;
  flex-direction:column;
  align-items:center;
  opacity:.6;
  cursor:pointer;
  font-weight:600;
}
.bottom button.active,
.bottom button:hover{
  opacity:1;
  color:var(--accent);
}
.bottom button span{ font-size:22px; }
</style>
</head>

<body>

<div id="loginOverlay">
  <div class="login-card">
    <h2>🔒 Admin Login</h2>
    <input type="password" id="passInput" placeholder="Enter Password">
    <button onclick="checkPass()">Login</button>
    <p id="errMsg" style="color:red; font-size:12px; display:none; margin-top:10px;">தவறான கடவுச்சொல்!</p>
  </div>
</div>

<div id="mainApp">
  <header>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    Admin Panel
  </header>

  <div id="sidebar" class="sidebar">
    <a href="index.html">🏠 Dashboard</a>
    <a href="workouts.html">🔥 Workouts</a>
    <a href="diet.html">🥗 Diet Plans</a>
  </div>

  <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

  <div class="main">
    <div class="work-card" onclick="location.href='login membership List.html'">
      <h3>Membership list</h3>
      <p>Login payment membership list</p>
    </div>

    <div class="work-card" onclick="location.href='Recreat.html'">
      <h3>Recreat</h3>
      <p>Screenshot Must</p>
    </div>
  </div>

  <div class="bottom">
    <button onclick="location.href='index.html'"><span>🏠</span>Home</button>
    <button class="active" onclick="location.href='workouts.html'"><span>🔥</span>Workout</button>
    <button onclick="location.href='diet.html'"><span>🥗</span>Diet</button>
  </div>
</div>

<script>
// Password check logic
function checkPass() {
  const pass = document.getElementById("passInput").value;
  if (pass === "Admin12345") {
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("mainApp").style.display = "block";
  } else {
    document.getElementById("errMsg").style.display = "block";
    document.getElementById("passInput").value = "";
  }
}

// Sidebar toggle
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

// Enter Key support
document.getElementById("passInput").addEventListener("keyup", function(e) {
  if (e.key === "Enter") checkPass();
});
</script>

</body>
</html>

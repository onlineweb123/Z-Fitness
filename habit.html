<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Habit Tracker - Z Fitness</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAbcluHlCBt5acY5qBwjJgjbSYk7EgeT90",
    authDomain: "z-fitness-a.firebaseapp.com",
    projectId: "z-fitness-a",
    storageBucket: "z-fitness-a.firebasestorage.app",
    messagingSenderId: "289896498711",
    appId: "1:289896498711:web:6bc6943dcfb06cca2d7e52",
    measurementId: "G-G8BVVRSCXH",
    databaseURL: "https://z-fitness-a-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  window.db = database;
  window.dbRef = ref;
  window.dbSet = set;
  window.dbOnValue = onValue;
  window.dbRemove = remove;

  initApp();
</script>

<style>
:root{
  --bg:#eef3f8; --card:#ffffff; --border:#d7e0ea;
  --accent:#007bff; --accent2:#00c08b; --text:#222;
  --green:#00b050; --yellow:#ffcc00; --red:#ff4b4b;
}

body{ font-family:'Poppins',sans-serif; background:var(--bg); margin:0; padding:16px; color:var(--text); }
.container{ max-width:1200px; margin:auto; }
h1{ text-align:center; color:var(--accent); }

.control-panel{ background:var(--card); border-radius:20px; padding:15px; margin-bottom:20px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
#habitInput{ width:70%; padding:10px; border:1px solid var(--border); border-radius:10px; }

button{ border:none; border-radius:10px; cursor:pointer; font-weight:600; transition: 0.3s; }
#addBtn{ background:var(--accent); color:#fff; padding:10px 15px; }

/* Save Button Status */
#saveBtn{ background:var(--accent2); color:#fff; margin-top:10px; width:100%; padding:15px; font-size:16px; }
#saveBtn.loading { background: #6c757d !important; cursor: not-allowed; }
#saveBtn.error { background: var(--red) !important; }
#saveBtn.success { background: #28a745 !important; }

.habit-item{ display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:10px; background:#fff; }
.color-buttons button{ width:30px; height:30px; margin:0 5px; border-radius:50%; border:2px solid #ddd; }
.color-buttons .green{background:var(--green);}
.color-buttons .yellow{background:var(--yellow);}
.color-buttons .red{background:var(--red);}
.color-buttons button.active{ border:3px solid #000; box-shadow: 0 0 5px rgba(0,0,0,0.3); }

.months{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; margin-top:20px; }
.month{ background:var(--card); border-radius:20px; padding:15px; box-shadow:0 4px 10px rgba(0,0,0,0.06); }
.days{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.day{ width:100%; aspect-ratio:1/1; display:flex; justify-content:center; align-items:center; background:#f3f6f9; border-radius:8px; cursor:pointer; font-size:12px; }

.day.done{ background:var(--green); color:#fff; }
.day.partial{ background:var(--yellow); color:#333; }
.day.missed{ background:var(--red); color:#fff; }

#loadingStatus { text-align: center; font-weight: bold; color: var(--accent); margin-bottom: 10px; }
</style>
</head>
<body>

<div class="container">
  <h1>🗓️ Habit Tracker</h1>

  <div id="loadingStatus">Cloud-டன் இணைக்கப்படுகிறது...</div>

  <div class="control-panel">
    <div style="display:flex; gap:10px;">
      <input type="text" id="habitInput" placeholder="புதிய Habit...">
      <button id="addBtn" onclick="addHabit()">சேர்</button>
    </div>
    <div id="dateLabel" style="margin:10px 0; font-size:14px; text-align:center;"></div>
    <div id="habitList"></div>
    <button id="saveBtn" onclick="saveDayData()">💾 Save</button>
  </div>

  <div class="months" id="calendar"></div>
</div>

<script>
const months = ["ஜனவரி","பிப்ரவரி","மார்ச்","ஏப்ரல்","மே","ஜூன்","ஜூலை","ஆகஸ்ட்","செப்டம்பர்","அக்டோபர்","நவம்பர்","டிசம்பர்"];
const daysInMonth = [31,28,31,30,31,30,31,31,30,31,30,31];
const today = new Date();
const currentYear = today.getFullYear();
const userName = localStorage.getItem("name") || "Guest";

let habits = [];
let dayData = {};

// 1. Firebase-ல் இருந்து தகவல்களை எடுத்தல்
function initApp() {
    const dateLabel = document.getElementById("dateLabel");
    dateLabel.textContent = `இன்று: ${today.getDate()}/${today.getMonth()+1}/${currentYear}`;

    if(window.db) {
        // Habits பெயர்களை எடுத்தல்
        window.dbOnValue(window.dbRef(window.db, `users/${userName}/habitsList`), (snapshot) => {
            habits = snapshot.val() || [];
            renderHabits();
        });

        // Calendar டேட்டாவை எடுத்தல்
        window.dbOnValue(window.dbRef(window.db, `users/${userName}/habitCalendar/${currentYear}`), (snapshot) => {
            dayData = snapshot.val() || {};
            document.getElementById("loadingStatus").style.display = "none";
            createCalendar();
        });
    }
}

async function addHabit(){
  const val = document.getElementById("habitInput").value.trim();
  if(!val) return;
  
  habits.push(val);
  document.getElementById("habitInput").value="";
  await window.dbSet(window.dbRef(window.db, `users/${userName}/habitsList`), habits);
}

function renderHabits(){
  const list = document.getElementById("habitList");
  list.innerHTML="";
  habits.forEach((h,i)=>{
    list.innerHTML += `
      <div class="habit-item">
        <div class="habit-name">${h}</div>
        <div class="color-buttons" data-index="${i}">
          <button class="green" onclick="setColor(${i},'green')"></button>
          <button class="yellow" onclick="setColor(${i},'yellow')"></button>
          <button class="red" onclick="setColor(${i},'red')"></button>
        </div>
      </div>`;
  });
}

function setColor(index, color){
  const btns = document.querySelectorAll(`.habit-item:nth-child(${index+1}) .color-buttons button`);
  btns.forEach(b => b.classList.remove("active"));
  document.querySelector(`.habit-item:nth-child(${index+1}) .color-buttons .${color}`).classList.add("active");
}

// 2. சேமிக்கும் போது டவர் செக்கிங்
async function saveDayData(){
  const saveBtn = document.getElementById("saveBtn");
  const dateKey = `${today.getMonth()+1}-${today.getDate()}`;
  
  let currentSelection = [];
  const items = document.querySelectorAll(".habit-item");
  items.forEach((item, i) => {
    let color = "none";
    if(item.querySelector(".green.active")) color="green";
    else if(item.querySelector(".yellow.active")) color="yellow";
    else if(item.querySelector(".red.active")) color="red";
    currentSelection.push({ name: habits[i], color });
  });

  // பட்டன் மாற்றம்
  saveBtn.disabled = true;
  saveBtn.innerText = "⏳ Saving...";
  saveBtn.className = "loading";

  // நெட்வொர்க் டைம்-அவுட் (10 வினாடி)
  const timer = setTimeout(() => {
    saveBtn.innerText = "❌ Not Stored (No Tower)";
    saveBtn.className = "error";
    setTimeout(resetBtn, 3000);
  }, 10000);

  try {
    await window.dbSet(window.dbRef(window.db, `users/${userName}/habitCalendar/${currentYear}/${dateKey}`), currentSelection);
    clearTimeout(timer);
    saveBtn.innerText = "✅ Saved!";
    saveBtn.className = "success";
    setTimeout(resetBtn, 2000);
  } catch (e) {
    clearTimeout(timer);
    saveBtn.innerText = "❌ Error Occurred";
    saveBtn.className = "error";
    setTimeout(resetBtn, 3000);
  }
}

function resetBtn() {
    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = false;
    saveBtn.innerText = "💾 Save";
    saveBtn.className = "";
}

function createCalendar(){
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  months.forEach((m,mi)=>{
    const monthDiv=document.createElement("div");
    monthDiv.className="month";
    monthDiv.innerHTML=`<h3 style="text-align:center; color:var(--accent);">${m}</h3>`;
    const daysDiv=document.createElement("div");
    daysDiv.className="days";

    for(let d=1;d<=daysInMonth[mi];d++){
      const box=document.createElement("div");
      box.className="day";
      box.textContent=d;
      const key=`${mi+1}-${d}`;
      const entry = dayData[key];

      if(entry){
        const g = entry.filter(e => e.color === 'green').length;
        const y = entry.filter(e => e.color === 'yellow').length;
        const r = entry.filter(e => e.color === 'red').length;
        if(g > y && g > r) box.classList.add("done");
        else if(y >= g && y >= r) box.classList.add("partial");
        else if(r > g && r > y) box.classList.add("missed");
      }
      box.onclick = () => openDay(mi+1, d);
      daysDiv.appendChild(box);
    }
    monthDiv.appendChild(daysDiv);
    cal.appendChild(monthDiv);
  });
}

function openDay(month, day){
  const key = `${month}-${day}`;
  const entry = dayData[key] || [];
  if(entry.length === 0) return alert(`${day}/${month} - தகவல் இல்லை`);
  
  let msg = `நாள்: ${day}/${month}/${currentYear}\n\n`;
  entry.forEach(e => {
    let status = e.color === "green" ? "முடிக்கப்பட்டது" : e.color === "yellow" ? "பாதி" : e.color === "red" ? "செய்யவில்லை" : "No Data";
    msg += `${e.name}: ${status}\n`;
  });
  alert(msg);
}
</script>
</body>
</html>

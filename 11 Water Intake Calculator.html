<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Water Intake Calculator</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans Tamil', sans-serif;
      background-color: #e0f7fa;
      padding: 20px;
      text-align: center;
    }
    .calculator {
      background-color: #ffffff;
      border-radius: 20px;
      padding: 25px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 10px;
      margin: 10px;
      width: 90%;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #00796b;
      color: white;
      border: none;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      font-size: 20px;
      color: #004d40;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>💧 நீர் தேவையின் கணக்கீடு</h2>
    <label for="weight">உங்கள் எடை (கிலோவில்):</label><br>
    <input type="number" id="weight" placeholder="எடை உள்ளிடவும்"><br>
    <button onclick="calculateWater()">கணக்கிடு</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    function calculateWater() {
      const weight = parseFloat(document.getElementById("weight").value);
      if (!weight || weight <= 0) {
        document.getElementById("result").innerHTML = "தவறான எடை அளவு!";
        return;
      }
      const waterML = weight * 35;
      const waterL = (waterML / 1000).toFixed(2);
      document.getElementById("result").innerHTML = 
        `உங்கள் நாளாந்த நீர் தேவை: <b>${waterML} ml</b> அல்லது <b>${waterL} L</b>`;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Z Fitness | Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, update, get, child } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAbcluHlCBt5acY5qBwjJgjbSYk7EgeT90",
            authDomain: "z-fitness-a.firebaseapp.com",
            projectId: "z-fitness-a",
            storageBucket: "z-fitness-a.firebasestorage.app",
            messagingSenderId: "289896498711",
            appId: "1:289896498711:web:6bc6943dcfb06cca2d7e52",
            databaseURL: "https://z-fitness-a-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        window.db = database;
        window.dbRef = ref;
        window.dbUpdate = update;
        window.dbGet = get;
        window.dbChild = child;
    </script>

    <style>
        :root { 
            --bg: #f8fbff; --card: #ffffff; --border: #e2e8f0; 
            --primary: #0077b6; --accent: #e63946;
            --text-main: #1e293b; --text-sub: #64748b;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-container { width: 100%; max-width: 400px; background: var(--card); padding: 30px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); border: 1px solid var(--border); text-align: center; }
        h2 { color: var(--primary); font-weight: 800; margin-bottom: 10px; }
        p { color: var(--text-sub); font-size: 14px; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--text-main); }
        .form-group input { width: 100%; padding: 12px 15px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary); }

        .btn-auth { 
            width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 15px; 
            font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px;
        }
        .btn-auth:disabled { opacity: 0.7; cursor: not-allowed; }

        #resetSection { display: none; margin-top: 20px; padding-top: 20px; border-top: 2px dashed var(--border); }
        .error-msg { color: #ff4757; font-size: 13px; margin-bottom: 15px; display: none; background: #fff0f1; padding: 10px; border-radius: 10px; }
        .success-msg { color: #2ed573; font-size: 13px; margin-bottom: 15px; display: none; background: #eafff2; padding: 10px; border-radius: 10px; }
        .back-link { display: block; margin-top: 20px; font-size: 14px; color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>Reset Password</h2>
    <p>Verify your identity to create a new password</p>

    <div id="errorBox" class="error-msg"></div>
    <div id="successBox" class="success-msg"></div>

    <div id="verifySection">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="verifyUser" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label>Registered Phone Number</label>
            <input type="tel" id="verifyPhone" placeholder="Enter 10 digit number">
        </div>
        <button onclick="handleVerify()" class="btn-auth" id="verifyBtn">Verify Details</button>
    </div>

    <div id="resetSection">
        <div class="form-group">
            <label>Create New Password</label>
            <input type="password" id="newPass" placeholder="••••••••">
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPass" placeholder="••••••••">
        </div>
        <button onclick="handleReset()" class="btn-auth" id="resetBtn" style="background: #009f7b;">Update Password</button>
    </div>

    <a href="login.html" class="back-link">← Back to Login</a>
</div>

<script>
    let verifiedUsername = "";

    function showStatus(type, msg) {
        const err = document.getElementById('errorBox');
        const succ = document.getElementById('successBox');
        err.style.display = 'none';
        succ.style.display = 'none';

        if(type === 'error') {
            err.innerText = msg;
            err.style.display = 'block';
        } else {
            succ.innerText = msg;
            succ.style.display = 'block';
        }
    }

    async function handleVerify() {
        const user = document.getElementById('verifyUser').value.trim();
        const phone = document.getElementById('verifyPhone').value.trim();
        const btn = document.getElementById('verifyBtn');

        if(!user || !phone) return showStatus('error', 'Please fill all details');

        btn.disabled = true;
        btn.innerText = "Verifying...";

        try {
            const snapshot = await window.dbGet(window.dbChild(window.dbRef(window.db), `users/${user}/profile`));

            if (snapshot.exists()) {
                const data = snapshot.val();
                // Username-க்குரிய Phone Number சரியாக உள்ளதா எனப் பார்க்கிறோம்
                if (data.phone === phone) {
                    verifiedUsername = user;
                    document.getElementById('verifySection').style.opacity = "0.5";
                    document.getElementById('verifyBtn').style.display = "none";
                    document.getElementById('resetSection').style.display = "block";
                    showStatus('success', 'Identity Verified! Now set your new password.');
                } else {
                    showStatus('error', 'Phone number does not match!');
                }
            } else {
                showStatus('error', 'Username not found!');
            }
        } catch (e) {
            showStatus('error', 'Network error. Try again.');
        } finally {
            btn.disabled = false;
            btn.innerText = "Verify Details";
        }
    }

    async function handleReset() {
        const pass = document.getElementById('newPass').value;
        const confirm = document.getElementById('confirmPass').value;
        const btn = document.getElementById('resetBtn');

        if(pass.length < 4) return showStatus('error', 'Password too short!');
        if(pass !== confirm) return showStatus('error', 'Passwords do not match!');

        btn.disabled = true;
        btn.innerText = "Updating...";

        try {
            // பாஸ்வேர்டை மட்டும் அப்டேட் செய்கிறோம்
            await window.dbUpdate(window.dbRef(window.db, `users/${verifiedUsername}/profile`), {
                password: pass
            });

            showStatus('success', 'Password updated! Redirecting to login...');
            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
        } catch (e) {
            showStatus('error', 'Update failed!');
            btn.disabled = false;
            btn.innerText = "Update Password";
        }
    }
</script>
</body>
</html>

<html>
<head>

    <link rel='stylesheet' href='./style.css'>
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <script>
        if('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js');
        };
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="PWA Example">

    <meta name="msapplication-TileColor" content="#ffffff">

    <style>
:root{
  --bg:#eef3f8;
  --card:#ffffffcc;
  --border:#d7e0ea;
  --accent:#007bff;
  --accent2:#009f7b;
  --text:#1c1c1c;
}

body{
  margin:0;
  font-family:'Poppins',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
*,button,a{transition:0.25s;}

header{
  height:60px; display:flex; align-items:center; justify-content:center;
  font-size:19px; font-weight:700;
  position:fixed; top:0; left:0; right:0;
  background:blue; color:white;
  z-index:10;
}
.menu-btn{position:absolute; left:14px; font-size:26px; background:none; border:none; color:white; cursor:pointer;}

.sidebar{
  width:250px; background:#ffffffee; position:fixed; top:0; bottom:0; left:-260px; 
  padding-top:75px; border-right:1px solid var(--border); transition:.35s;
  backdrop-filter:blur(10px);
  z-index:20;
}
.sidebar.open{left:0;}
.sidebar a{
  display:flex; align-items:center; padding:16px 22px; font-size:17px; 
  text-decoration:none; color:var(--text); border-bottom:1px solid #f1f4f6;
}
.sidebar a:hover{background:#f8fffd; color:var(--accent); padding-left:28px;}

.overlay{
  position:fixed; inset:0; background:#0008; 
  display:none; backdrop-filter:blur(4px);
  z-index:15;
}
.overlay.show{display:block;}

.main{position:absolute; top:65px; bottom:65px; left:0; right:0; overflow-y:auto; padding:18px; transition:.3s;}
.main.blur{filter:blur(6px);}

.card{
  padding:18px; background:var(--card); border-radius:18px;
  box-shadow:0 6px 14px rgba(0,0,0,.08); margin-bottom:16px;
  border:1px solid var(--border);
}

#greet{font-size:22px; font-weight:700; margin-bottom:12px;}  

.chart-box{
  height:170px; background:#fff; border-radius:12px; border:1px solid var(--border);
  padding:8px;
}

.chart-days{display:flex; gap:4px; height:100%; align-items:flex-end;}
.chart-bar{width:10px;border-radius:4px;transition:.3s;}

/* Colors */
.future{background:#cfcfcf;}
.completed{background:#007bff;}
.medium{background:orange;}
.missed{background:red;}

.stats{display:flex; justify-content:space-between; margin-top:12px;}
.stat{background:#fff; padding:12px; flex:1; margin:4px; border-radius:12px; text-align:center; font-size:14px; border:1px solid var(--border);}
.stat strong{font-size:18px; display:block; margin-bottom:4px;}

#calorieTargetText {
    font-size: 26px; 
    font-weight: 700;
    color: var(--accent2); 
    text-align: center;
    margin: 10px 0 5px 0;
}

.bottom{
  height:60px; position:fixed; bottom:0; left:0; right:0; 
  display:flex; justify-content:space-around; align-items:center; 
  background:#ffffffcc; border-top:1px solid var(--border); z-index:10;
}
.bottom button{
  background:none; border:none; font-size:13px; 
  display:flex; flex-direction:column; align-items:center; opacity:.6;
}
.bottom button.active{opacity:1; color:var(--accent);}
.bottom button span{font-size:22px;}

#loginOverlay {
    position: fixed; 
    inset: 0; 
    background: rgba(0,0,0,0.9);
    display: flex; 
    align-items: center; 
    justify-content: center;
    z-index: 9999; 
    backdrop-filter: blur(10px);
}

.login-card {
    background: white; 
    padding: 30px; 
    border-radius: 20px;
    width: 85%; 
    max-width: 350px; 
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.login-card input {
    width: 100%; 
    padding: 12px; 
    margin: 10px 0;
    border: 1px solid #ddd; 
    border-radius: 8px; 
    box-sizing: border-box;
}

.login-card button {
    width: 100%; 
    padding: 12px; 
    background: #007bff;
    color: white; 
    border: none; 
    border-radius: 8px; 
    cursor: pointer;
    font-weight: bold;
}

.error-msg { 
    color: red; 
    font-size: 13px; 
    margin-top: 10px; 
    display: none; 
}
</style>

</head>
<body>

<header>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  💪 Z Fitness
</header>

<div id="sidebar" class="sidebar">
  <a href="index.html">🏠 Dashboard</a>
  <a href="workouts.html">🔥 Workouts</a>
  <a href="diet.html">🥗 Diet Plans</a>
  <a href="fit tools.html">📋 Fit Tools</a>
  <a href="habit traker.html">♾️ Habit Traker</a>
  <a href="nutrition tracker.html">🍱 Nutrition Tracker</a>
  <a href="meditation.html">🎧 Meditation</a>
  <a href="progress.html">📊 Progress Tracker</a>
  <a href="profile.html">👤 Profile</a>
  <a href="settings.html">⚙️ Settings</a>
  <a href="terms and condition.html">📃 terms & condi...</a>

  <a href="#" onclick="shareApp()">🔁 Share</a>
</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div id="main" class="main">
  <div id="greet">Hi 👋, <span id="username"></span></div>

  <div class="card">
    <h3>📈 Monthly Workout</h3>
    <div class="chart-box">
      <div class="chart-days" id="daysChart"></div>
    </div>
  </div>

  <div class="card">
    <h3>🔥 Today Goals</h3>
    <p id="todayWorkoutText"></p>
  </div>
  
  <div class="card">
    <h3>🍽️ Calorie Target</h3>
    <p id="calorieTargetText"></p>
  </div>

  <div class="stats">
    <div class="stat"><strong id="weightShow">--</strong>kg<br>Weight</div>
    <div class="stat"><strong id="goalShow">--</strong><br>Goal</div>
    <div class="stat"><strong id="levelShow">--</strong><br>Level</div>
  </div>
</div>

<div class="bottom">
  <button class="active"><span>🏠</span>Home</button>
  <button onclick="location.href='workouts.html'"><span>🔥</span>Workout</button>
  <button onclick="location.href='diet.html'"><span>🥗</span>Diet</button>
  <button onclick="location.href='profile.html'"><span>👤</span>Profile</button>
</div>

<div id="loginOverlay">
    <div class="login-card">
        <h2>🔒 Z Fitness Login</h2>
        <input type="text" id="uName" placeholder="User Name">
        <input type="password" id="uPass" placeholder="Password">
        <button onclick="checkLogin()">Login</button>
        <p id="error" class="error-msg"></p>
    </div>
</div>

</ul>

<script>
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
  document.getElementById("main").classList.toggle("blur");
}

const get = k => localStorage.getItem(k) || "--";

// Dashboard Data Loading
function loadDashboard() {
    document.getElementById("username").innerText = localStorage.getItem("name") || "--";
    document.getElementById("weightShow").innerText = get("weight");
    document.getElementById("goalShow").innerText = get("goal");
    document.getElementById("levelShow").innerText = get("workout-level");
    const calorieValue = get("calorie");
    document.getElementById("calorieTargetText").innerText = calorieValue !== "--" ? `${calorieValue} kcal` : "Set your target in Profile";
    document.getElementById("todayWorkoutText").innerText = get("todayWorkout") || "Rest Day 😴";
}

// Chart Logic
const daysContainer = document.getElementById("daysChart");
const today = new Date();
const year = today.getFullYear();
const month = today.getMonth();
const totalDays = new Date(year, month+1, 0).getDate();
const todayDate = today.getDate();
let doneDays = JSON.parse(localStorage.getItem("doneWorkoutDays")) || [];
let mediumDays = JSON.parse(localStorage.getItem("mediumWorkoutDays")) || [];

for(let i = 1; i <= totalDays; i++){
  let bar = document.createElement("div");
  bar.classList.add("chart-bar");
  if(i > todayDate){ bar.classList.add("future"); bar.style.height="20%"; }
  else if(doneDays.includes(i)){ bar.classList.add("completed"); bar.style.height="100%"; }
  else if(mediumDays.includes(i)){ bar.classList.add("medium"); bar.style.height="60%"; }
  else{ bar.classList.add("missed"); bar.style.height="35%"; }
  daysContainer.appendChild(bar);
}

function shareApp(){
    if (navigator.share) {
        navigator.share({
            title: "Z Fitness",
            text: "Check out this Fitness App!",
            url: "https://onlineweb123.github.io/Z-Fitness/"
        }).catch(err => console.log("Share cancelled"));
    } else {
        alert("Your device does not support sharing.");
    }
}

// --- Login Logic with Expiry Check ---
function checkLogin() {
    const userIn = document.getElementById("uName").value;
    const passIn = document.getElementById("uPass").value;
    const error = document.getElementById("error");
    const users = document.querySelectorAll("#userDatabase li");
    const now = new Date();

    let authenticated = false;
    let expired = false;

    users.forEach(u => {
        const uName = u.getAttribute("data-user");
        const uPass = u.getAttribute("data-pass");
        const uExpiry = new Date(u.getAttribute("data-expiry"));

        if (userIn === uName && passIn === uPass) {
            if (now <= uExpiry) {
                authenticated = true;
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("name", uName);
            } else {
                expired = true;
            }
        }
    });

    if (authenticated) {
        document.getElementById("loginOverlay").style.display = "none";
        loadDashboard();
        error.style.display = "none";
    } else if (expired) {
        error.innerText = "Access Expired! Contact Admin.";
        error.style.display = "block";
    } else {
        error.innerText = "Incorrect User Name or Password!";
        error.style.display = "block";
    }
}

// Check session and Expiry on load
window.onload = function() {
    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
    const loggedName = localStorage.getItem("name");
    const now = new Date();
    let validSession = false;

    if (isLoggedIn && loggedName) {
        const users = document.querySelectorAll("#userDatabase li");
        users.forEach(u => {
            if (u.getAttribute("data-user") === loggedName) {
                const uExpiry = new Date(u.getAttribute("data-expiry"));
                if (now <= uExpiry) {
                    validSession = true;
                }
            }
        });
    }

    if (validSession) {
        document.getElementById("loginOverlay").style.display = "none";
        loadDashboard();
    } else {
        // If expired or not logged in, force show login
        localStorage.removeItem("isLoggedIn");
        document.getElementById("loginOverlay").style.display = "flex";
    }
};

function logout() {
    localStorage.removeItem("isLoggedIn");
    location.reload();
}
</script>

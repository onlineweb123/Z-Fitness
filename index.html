<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Z Fitness</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAbcluHlCBt5acY5qBwjJgjbSYk7EgeT90",
    authDomain: "z-fitness-a.firebaseapp.com",
    projectId: "z-fitness-a",
    storageBucket: "z-fitness-a.firebasestorage.app",
    messagingSenderId: "289896498711",
    appId: "1:289896498711:web:6bc6943dcfb06cca2d7e52",
    measurementId: "G-G8BVVRSCXH",
    databaseURL: "https://z-fitness-a-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // Global variables for other functions
  window.db = database;
  window.dbRef = ref;
  window.dbOnValue = onValue;

  // --- Google Login Function ---
  window.loginWithGoogle = function() {
      signInWithPopup(auth, provider)
        .then((result) => {
            console.log("Logged in!");
        }).catch((error) => {
            alert("Login Failed: " + error.message);
        });
  }

  // --- Logout Function ---
  window.logout = function() {
      signOut(auth).then(() => {
          location.reload();
      });
  }

  // --- Auth State Change (Check if logged in) ---
  onAuthStateChanged(auth, (user) => {
      if (user) {
          document.getElementById("loginOverlay").style.display = "none";
          document.getElementById("username").innerText = user.displayName;
          window.userName = user.displayName; // Using name as key
          loadCloudData();
      } else {
          document.getElementById("loginOverlay").style.display = "flex";
      }
  });

</script>

<style>
:root{
  --bg:#eef3f8; --card:#ffffffcc; --border:#d7e0ea;
  --accent:#007bff; --accent2:#009f7b; --text:#1c1c1c;
}
body{ margin:0; font-family:'Poppins',Arial,sans-serif; background:var(--bg); color:var(--text); }
*,button,a{transition:0.25s;}
header{ height:60px; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; position:fixed; top:0; left:0; right:0; background:blue; color:white; z-index:10; }
.menu-btn{position:absolute; left:14px; font-size:26px; background:none; border:none; color:white; cursor:pointer;}
.sidebar{ width:250px; background:#ffffffee; position:fixed; top:0; bottom:0; left:-260px; padding-top:75px; border-right:1px solid var(--border); transition:.35s; backdrop-filter:blur(10px); z-index:20; }
.sidebar.open{left:0;}
.sidebar a{ display:flex; align-items:center; padding:16px 22px; font-size:17px; text-decoration:none; color:var(--text); border-bottom:1px solid #f1f4f6; }
.main{position:absolute; top:65px; bottom:65px; left:0; right:0; overflow-y:auto; padding:18px; transition:.3s;}
.card{ padding:18px; background:var(--card); border-radius:18px; box-shadow:0 6px 14px rgba(0,0,0,.08); margin-bottom:16px; border:1px solid var(--border); }
#greet{font-size:22px; font-weight:700; margin-bottom:12px;}  
.chart-box{ height:170px; background:#fff; border-radius:12px; border:1px solid var(--border); padding:8px; }
.chart-days{display:flex; gap:4px; height:100%; align-items:flex-end;}
.chart-bar{width:10px;border-radius:4px;transition:.3s;}
.future{background:#cfcfcf;} .completed{background:#007bff;} .medium{background:orange;} .missed{background:red;}
.stats{display:flex; justify-content:space-between; margin-top:12px;}
.stat{background:#fff; padding:12px; flex:1; margin:4px; border-radius:12px; text-align:center; font-size:14px; border:1px solid var(--border);}
.stat strong{font-size:18px; display:block; margin-bottom:4px;}
#calorieTargetText { font-size: 26px; font-weight: 700; color: var(--accent2); text-align: center; margin: 10px 0 5px 0; }
.bottom{ height:60px; position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-around; align-items:center; background:#ffffffcc; border-top:1px solid var(--border); z-index:10; }
.bottom button{ background:none; border:none; font-size:13px; display:flex; flex-direction:column; align-items:center; opacity:.6; }
.bottom button.active{opacity:1; color:var(--accent);}
#loginOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; backdrop-filter: blur(10px); }
.login-card { background: white; padding: 40px 20px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; }
.google-btn { width: 100%; padding: 12px; background: white; color: #444; border: 1px solid #ddd; border-radius: 8px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
.google-btn img { width: 20px; }
.water-container { text-align: center; padding: 20px; background: white; border-radius: 20px; }
.water-glass { width: 60px; height: 90px; border: 3px solid #333; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; margin: 15px auto; position: relative; overflow: hidden; background: #f0f0f0; }
.water-fill { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, #00d2ff, #3a7bd5); height: 0%; transition: 0.6s; }
.water-controls { display: flex; justify-content: center; align-items: center; gap: 15px; }
.w-btn { background: #007bff; color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }
</style>
</head>

<body>

<header>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  💪 Z Fitness
</header>

<div id="sidebar" class="sidebar">
  <a href="index.html">🏠 Dashboard</a>
  <a href="profile.html">👤 Profile</a>
  <a href="#" onclick="logout()" style="color: red;">🚪 Logout</a>
</div>

<div id="main" class="main">
  <div id="greet">Hi 👋, <span id="username">Guest</span></div>

  <div class="card">
    <h3>📈 Monthly Workout</h3>
    <div class="chart-box"><div class="chart-days" id="daysChart"></div></div>
  </div>

  <div class="card">
    <h3>🔥 Today Goals</h3>
    <p id="todayWorkoutText">Connecting...</p>
  </div>

  <div class="card water-container">
    <h3>💧 Water Intake</h3>
    <div class="water-glass"><div id="waterFill" class="water-fill"></div></div>
    <div class="water-controls">
        <button class="w-btn" onclick="updateWater(-250)">-</button>
        <span id="waterText">0 ml</span>
        <button class="w-btn" onclick="updateWater(250)">+</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><strong id="weightShow">--</strong>kg<br>Weight</div>
    <div class="stat"><strong id="goalShow">--</strong><br>Goal</div>
    <div class="stat"><strong id="levelShow">--</strong><br>Level</div>
  </div>
</div>

<div class="bottom">
  <button class="active"><span>🏠</span>Home</button>
  <button onclick="location.href='workouts.html'"><span>🔥</span>Workout</button>
  <button onclick="location.href='nutrition tracker.html'"><span>🥗</span>Diet</button>
  <button onclick="location.href='profile.html'"><span>👤</span>Profile</button>
</div>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="margin-bottom: 30px;">💪 Z Fitness</h2>
        <p>தொடர உங்கள் கூகுள் கணக்கு மூலம் லாகின் செய்யவும்</p>
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="google">
            Sign in with Google
        </button>
    </div>
</div>

<script>
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
}

function loadCloudData() {
    const now = new Date();
    const todayKey = now.toLocaleDateString('en-CA', {timeZone: 'Asia/Kolkata'});
    const monthYear = (now.getMonth() + 1) + "_" + now.getFullYear();
    const u = window.userName;

    // Profile
    window.dbOnValue(window.dbRef(window.db, `users/${u}/profile`), (snapshot) => {
        const d = snapshot.val();
        if(d) {
            document.getElementById("weightShow").innerText = d.weight || "--";
            document.getElementById("goalShow").innerText = d.goal || "--";
            document.getElementById("levelShow").innerText = d.workoutLevel || "--";
        }
    });

    // Workout Chart
    window.dbOnValue(window.dbRef(window.db, `users/${u}/logs/${monthYear}`), (snapshot) => {
        const logs = snapshot.val() || {};
        renderChart(logs);
        document.getElementById("todayWorkoutText").innerText = logs[now.getDate()] ? logs[now.getDate()].status : "Rest Day 😴";
    });
    
    renderWater();
}

function renderChart(logs) {
    const container = document.getElementById("daysChart");
    container.innerHTML = "";
    const totalDays = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
    for(let i = 1; i <= totalDays; i++) {
        let bar = document.createElement("div");
        bar.className = "chart-bar";
        if(logs[i]) bar.classList.add("completed");
        else bar.classList.add("future");
        bar.style.height = "50%";
        container.appendChild(bar);
    }
}

function updateWater(amt) {
    let count = parseInt(localStorage.getItem("waterCount") || 0);
    count = Math.max(0, Math.min(3000, count + amt));
    localStorage.setItem("waterCount", count);
    renderWater();
}
function renderWater() {
    let count = parseInt(localStorage.getItem("waterCount") || 0);
    document.getElementById("waterFill").style.height = (count / 3000 * 100) + "%";
    document.getElementById("waterText").innerText = count + " ml";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Fitness | Premium Membership</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .payment-card { background: white; padding: 30px; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); max-width: 380px; width: 100%; text-align: center; border: 1px solid #e2e8f0; }
        .brand-name { font-size: 28px; font-weight: 800; color: #0f172a; margin-bottom: 5px; }
        .tagline { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        
        .price-box { margin: 15px 0; }
        .old-price { font-size: 18px; color: #94a3b8; text-decoration: line-through; }
        .new-price { font-size: 36px; font-weight: 800; color: #0f172a; display: block; }
        
        /* QR Code Styling */
        .qr-container { margin: 20px 0; padding: 15px; background: #fff; border: 2px dashed #e2e8f0; border-radius: 20px; }
        .qr-image { width: 180px; height: 180px; object-fit: contain; border-radius: 10px; }
        .scan-text { font-size: 13px; color: #64748b; margin-top: 10px; font-weight: 600; }

        .btn-unlock { 
        background: #2563eb; 
        color: white; 
        padding: 16px; 
        border: none; 
        border-radius: 14px; 
        font-weight: 700; 
        cursor: pointer; 
        width: 87%; 
        font-size: 16px; 
        margin-bottom: 12px; 
        transition: 0.3s; 
        text-decoration: none; 
        display: block;
        
        
         }
        
        .btn-unlock:hover { 
        background: #1d4ed8; }
        
        .btn-whatsapp { 
        background: #25d366; 
        color: white; 
        padding: 16px; 
        border: none; 
        border-radius: 14px; 
        font-weight: 700; 
        cursor: pointer; 
        width: 100%; 
        font-size: 16px; 
        transition: 0.3s;
         }
        .btn-whatsapp:hover { background: #16a34a; }
        
        .footer-text { margin-top: 20px; font-size: 12px; color: #94a3b8; line-height: 1.5; }
        .contact-info { font-weight: 700; color: #0f172a; margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <div class="payment-card">
        <div class="brand-name">Z Fitness</div>
        <div class="tagline">Invest in your health</div>
        
        <div class="price-box">
            <span class="old-price">Rs: 4,999</span>
            <span class="new-price">Rs: 299</span>
        </div>

        <div class="qr-container">
            <img src="qr code.jpg" alt="UPI QR Code" class="qr-image">
            <div class="scan-text">Scan this QR to pay</div>
        </div>
        
        <a href="upi://pay?pa=mm05270331@oksbi&pn=ZFitness&am=299&cu=INR" class="btn-unlock">
            Pay via UPI App
        </a>

        <button class="btn-whatsapp" onclick="sendWhatsApp()">Send Payment Receipt</button>

        <p class="footer-text">
            Pay Rs.299 to activate your account. Send the screenshot via WhatsApp for instant access.
            <span class="contact-info">Support: 9344165879</span>
        </p>
    </div>

    <script>
        function sendWhatsApp() {
            const phoneNumber = "919344165879";
            const message = "Hi, I have completed the payment of Rs.299 for Z Fitness Premium. Please activate my account. [Attached: Payment Screenshot]";
            const url = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>

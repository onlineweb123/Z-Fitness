<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrition Tracker - Z Fitness</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAbcluHlCBt5acY5qBwjJgjbSYk7EgeT90",
    authDomain: "z-fitness-a.firebaseapp.com",
    projectId: "z-fitness-a",
    storageBucket: "z-fitness-a.firebasestorage.app",
    messagingSenderId: "289896498711",
    appId: "1:289896498711:web:6bc6943dcfb06cca2d7e52",
    measurementId: "G-G8BVVRSCXH",
    databaseURL: "https://z-fitness-a-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  window.db = database;
  window.dbRef = ref;
  window.dbSet = set;
  window.dbOnValue = onValue;
  window.dbRemove = remove;

  // App Initialization
  initApp();
</script>

<style>
    :root {
        --primary: #2563eb;
        --secondary: #16a34a;
        --danger: #dc2626;
        --bg: #f3f4f6;
        --card: #ffffff;
        --text: #1f2937;
    }

    body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; }
    h1 { text-align: center; font-size: 1.8rem; margin-bottom: 20px; }
    .card { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 24px; }
    .grid { display: grid; grid-template-cols: 1fr; gap: 12px; }
    @media (min-width: 768px) { .grid { grid-template-cols: 1fr 1fr; } }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; }

    /* Button Loading States */
    #addBtn { 
        background-color: var(--primary); color: white; padding: 12px; 
        width: 100%; margin-top: 16px; border: none; border-radius: 12px; 
        font-weight: bold; cursor: pointer; transition: 0.3s;
    }
    #addBtn.loading { background-color: #6b7280 !important; cursor: not-allowed; }
    #addBtn.success { background-color: var(--secondary) !important; }
    #addBtn.error { background-color: var(--danger) !important; }

    .btn-clear { background-color: var(--danger); color: white; padding: 10px 20px; border: none; border-radius: 12px; cursor: pointer; }
    .food-item { border: 1px solid #e5e7eb; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .btn-delete { color: var(--danger); background: none; border: none; font-size: 18px; cursor: pointer; }
    #totals { background-color: #dcfce7; color: #166534; padding: 16px; border-radius: 12px; font-weight: bold; text-align: center; }
    #loadingTxt { text-align: center; font-weight: bold; color: var(--primary); margin: 10px; }
</style>
</head>
<body>

    <h1>🥗 Nutrition Tracker</h1>

    <div class="card">
        <h2>உணவு சேர்க்க</h2>
        <div class="grid">
            <input id="foodTime" type="time" />
            <input id="foodName" placeholder="உணவு பெயர்" />
            <input id="calorie" type="number" placeholder="Calories (kcal)" />
            <input id="protein" type="number" placeholder="Protein (g)" />
            <input id="carbs" type="number" placeholder="Carbs (g)" />
            <input id="fat" type="number" placeholder="Fat (g)" />
        </div>
        <button id="addBtn" onclick="addFood()">Add Food</button>
    </div>

    <div id="loadingTxt" style="display:none;">Syncing with Cloud...</div>
    <div id="foodList" class="card"></div>
    <div id="totals"></div>
    <br>

    <div class="card">
        <h2>தேதியைத் தேர்ந்தெடுக்கவும்</h2>
        <input id="datePicker" type="date" onchange="loadDataForSelectedDate()"/>
    </div>

    <div style="text-align:center;">
        <button onclick="clearSelectedDay()" class="btn-clear">இந்த நாளின் Data Clear</button>
    </div>

<script>
let foods = [];
let selectedDateKey;
const userName = localStorage.getItem("name") || "Guest";
const addBtn = document.getElementById('addBtn');

function getISTDateKey() {
    return new Date().toLocaleDateString('en-CA', {timeZone: 'Asia/Kolkata'});
}

function initApp() {
    const todayIST = getISTDateKey();
    const datePicker = document.getElementById('datePicker');
    datePicker.value = todayIST;
    datePicker.max = todayIST;
    selectedDateKey = todayIST;
    loadDataForSelectedDate();
}

// Firebase-ல் இருந்து குறிப்பிட்ட தேதிக்கான தகவல்களை எடுத்தல்
function loadDataForSelectedDate() {
    selectedDateKey = document.getElementById('datePicker').value;
    if (!selectedDateKey) return;

    document.getElementById('loadingTxt').style.display = "block";
    
    if (window.db) {
        const foodRef = window.dbRef(window.db, `users/${userName}/nutrition/${selectedDateKey}`);
        window.dbOnValue(foodRef, (snapshot) => {
            foods = snapshot.val() || [];
            document.getElementById('loadingTxt').style.display = "none";
            render();
        });
    }
}

async function addFood() {
    const name = document.getElementById('foodName').value.trim();
    if (!name) return alert("உணவு பெயர் தேவை!");

    const newFood = {
        time: document.getElementById('foodTime').value || new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kolkata'}),
        name: name,
        calorie: parseFloat(document.getElementById('calorie').value) || 0,
        protein: parseFloat(document.getElementById('protein').value) || 0,
        carbs: parseFloat(document.getElementById('carbs').value) || 0,
        fat: parseFloat(document.getElementById('fat').value) || 0
    };

    // பட்டன் ஸ்டேட்ஸ் மாற்றம்
    addBtn.disabled = true;
    addBtn.innerText = "⏳ Saving...";
    addBtn.className = "loading";

    const originalFoods = [...foods];
    foods.push(newFood);
    foods.sort((a, b) => a.time.localeCompare(b.time));

    // நெட்வொர்க் டைம் அவுட்
    const timer = setTimeout(() => {
        addBtn.innerText = "❌ Not Stored (No Tower)";
        addBtn.className = "error";
        foods = originalFoods;
        setTimeout(resetBtn, 3000);
    }, 10000);

    try {
        await window.dbSet(window.dbRef(window.db, `users/${userName}/nutrition/${selectedDateKey}`), foods);
        clearTimeout(timer);
        addBtn.innerText = "✅ Saved!";
        addBtn.className = "success";
        clearInputs();
        setTimeout(resetBtn, 2000);
    } catch (e) {
        clearTimeout(timer);
        addBtn.innerText = "❌ Error Occurred";
        addBtn.className = "error";
        foods = originalFoods;
        setTimeout(resetBtn, 3000);
    }
}

function resetBtn() {
    addBtn.disabled = false;
    addBtn.innerText = "Add Food";
    addBtn.className = "";
}

function clearInputs() {
    document.getElementById('foodName').value = '';
    document.getElementById('calorie').value = '';
    document.getElementById('protein').value = '';
    document.getElementById('carbs').value = '';
    document.getElementById('fat').value = '';
}

async function deleteFood(index) {
    if (confirm("இந்த உணவை நீக்கவா?")) {
        foods.splice(index, 1);
        await window.dbSet(window.dbRef(window.db, `users/${userName}/nutrition/${selectedDateKey}`), foods);
    }
}

async function clearSelectedDay() {
    if (confirm(`நிச்சயமாக ${selectedDateKey} தகவல்களை நீக்கவா?`)) {
        await window.dbRemove(window.dbRef(window.db, `users/${userName}/nutrition/${selectedDateKey}`));
    }
}

function render() {
    const list = document.getElementById('foodList');
    list.innerHTML = `<h2>${selectedDateKey} க்கான பட்டியல்</h2>`;

    if (foods.length === 0) {
        list.innerHTML += '<p style="color:gray;">தகவல்கள் ஏதுமில்லை.</p>';
        document.getElementById('totals').innerHTML = '';
        return;
    }

    let tCal = 0, tP = 0, tC = 0, tF = 0;
    foods.forEach((f, i) => {
        tCal += f.calorie; tP += f.protein; tC += f.carbs; tF += f.fat;
        list.innerHTML += `
            <div class="food-item">
                <div>
                    <b>${f.name}</b> <small>(${f.time})</small><br>
                    <span>Cal: ${f.calorie} | P: ${f.protein}g | C: ${f.carbs}g | F: ${f.fat}g</span>
                </div>
                <button onclick="deleteFood(${i})" class="btn-delete">✕</button>
            </div>
        `;
    });
    document.getElementById('totals').innerHTML = `மொத்தம்: 🍽️ Cal: ${tCal.toFixed(0)} | P: ${tP.toFixed(1)}g | C: ${tC.toFixed(1)}g | F: ${tF.toFixed(1)}g`;
}
</script>
</body>
</html>

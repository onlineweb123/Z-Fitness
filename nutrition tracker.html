<style>
    /* Internal CSS - இணையம் இல்லாவிட்டாலும் வேலை செய்யும் */

        --danger: #dc2626;

        --text: #1f2937;
    }

    body {

<body>

    <h1>🥗 Daily Food & Nutrition Tracker</h1>

    <div class="card">
        <h2>உணவு சேர்க்க</h2>
        <div class="grid">
            <input id="foodTime" type="time" />
            <input id="foodName" placeholder="உணவு பெயர் (Egg, Rice...)" />
            <input id="calorie" type="number" placeholder="Calories (kcal)" />
            <input id="protein" type="number" placeholder="Protein (g)" />
            <input id="carbs" type="number" placeholder="Carbs (g)" />
            <input id="fat" type="number" placeholder="Fat (g)" />
        </div>
        <button onclick="addFood()" class="btn-add">Add Food</button>
    </div>

    <div id="foodList" class="card"></div>

    <div id="totals"></div>
    <br>
    
    <div class="card">
        <h2>தேதியைத் தேர்ந்தெடுக்கவும்</h2>
        <input id="datePicker" type="date" onchange="loadDataForSelectedDate()"/>
    </div>

    <div class="text-center">
        <button onclick="clearSelectedDay()" class="btn-clear">தேர்ந்தெடுத்த நாளின் Data Clear</button>
    </div>

<script>
// Global variable to hold the currently selected date key
let selectedDateKey;
let foods = [];

function getISTDateKey() {
    const now = new Date();
    const dateOptions = { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Kolkata' };
    const dateParts = new Intl.DateTimeFormat('en-CA', dateOptions).formatToParts(now);
    const year = dateParts.find(p => p.type === 'year').value;
    const month = dateParts.find(p => p.type === 'month').value;
    const day = dateParts.find(p => p.type === 'day').value;
    return `${year}-${month}-${day}`;
}

function getISTTime24Hr() {
    const now = new Date();
    const formatter = new Intl.DateTimeFormat('en-IN', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Kolkata'
    });
    return formatter.format(now);
}

function convertTo12HrIST(time24hr) {
    if (!time24hr || time24hr === 'N/A') return 'N/A';
    const [hours, minutes] = time24hr.split(':');
    let h = parseInt(hours, 10);
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; h = h ? h : 12; 
    const displayHour = h < 10 ? '0' + h : h;
    return `${displayHour}:${minutes} ${ampm}`;
}

document.addEventListener('DOMContentLoaded', () => {
    const todayIST = getISTDateKey();
    const datePicker = document.getElementById('datePicker');
    datePicker.value = todayIST;
    datePicker.max = todayIST;
    selectedDateKey = todayIST;
    loadDataForSelectedDate();
});

function loadDataForSelectedDate() {
    const datePickerValue = document.getElementById('datePicker').value;
    if (!datePickerValue) return;
    selectedDateKey = datePickerValue;
    foods = JSON.parse(localStorage.getItem(`FOODS_${selectedDateKey}`)) || [];
    
    if (selectedDateKey === getISTDateKey()) {
        document.getElementById('foodTime').value = getISTTime24Hr();
    } else {
         document.getElementById('foodTime').value = '';
    }
    render();
}

function addFood() {
    const food = {
        time: document.getElementById('foodTime').value || getISTTime24Hr(), 
        name: document.getElementById('foodName').value,
        calorie: parseFloat(document.getElementById('calorie').value) || 0,
        protein: parseFloat(document.getElementById('protein').value) || 0,
        carbs: parseFloat(document.getElementById('carbs').value) || 0,
        fat: parseFloat(document.getElementById('fat').value) || 0
    };

    if (!food.name) return alert("உணவு பெயர் தேவை!");

    foods.push(food);
    foods.sort((a, b) => (a.time > b.time) ? 1 : ((b.time > a.time) ? -1 : 0)); 
    localStorage.setItem(`FOODS_${selectedDateKey}`, JSON.stringify(foods));
    render();

    if (selectedDateKey === getISTDateKey()) {
        document.getElementById('foodTime').value = getISTTime24Hr(); 
    }
    document.getElementById('foodName').value = '';
    document.getElementById('calorie').value = '';
    document.getElementById('protein').value = '';
    document.getElementById('carbs').value = '';
    document.getElementById('fat').value = '';
}

function render() {
    const list = document.getElementById('foodList');
    list.innerHTML = `<h2>${selectedDateKey} க்கான உணவுகள்</h2>`;

    if (foods.length === 0) {
        list.innerHTML += '<p style="color:gray;">இன்னும் Food Add செய்யவில்லை.</p>';
        document.getElementById('totals').innerHTML = '';
        return;
    }

    let totalCal = 0, totalP = 0, totalC = 0, totalF = 0;

    foods.forEach((f, i) => {
        totalCal += f.calorie;
        totalP += f.protein;
        totalC += f.carbs;
        totalF += f.fat;
        const displayTime = convertTo12HrIST(f.time);

        list.innerHTML += `
            <div class="food-item">
                <div class="food-info"> 
                    <b style="display:block;">${f.name}</b>
                    <span>(${displayTime}) | Cal: ${f.calorie} | P: ${f.protein} | C: ${f.carbs} | F: ${f.fat}</span>
                </div>
                <button onclick="deleteFoodConfirmation(${i}, '${f.name}')" class="btn-delete">✕</button>
            </div>
        `;
    });

    document.getElementById('totals').innerHTML = `மொத்தம்: 🍽️ Cal: ${totalCal.toFixed(0)} | P: ${totalP.toFixed(1)}g | C: ${totalC.toFixed(1)}g | F: ${totalF.toFixed(1)}g`;
}

function deleteFoodConfirmation(i, foodName) {
    if (confirm(`உறுதியாகவா, ${foodName} ஐ நீக்க வேண்டுமா?`)) {
        deleteFood(i);
    }
}

function deleteFood(i) {
    foods.splice(i, 1);
    localStorage.setItem(`FOODS_${selectedDateKey}`, JSON.stringify(foods));
    render();
}

function clearSelectedDay() {
    if (confirm(`நீங்கள் தேர்ந்தெடுத்த நாளின் (${selectedDateKey}) Data எல்லாம் delete ஆகும். உறுதியாகவா?`)) {
        localStorage.removeItem(`FOODS_${selectedDateKey}`);
        foods = [];
        render();
    }
}
</script>

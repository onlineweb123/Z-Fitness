<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Fitness | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        .admin-card { background: #1e293b; padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); max-width: 400px; width: 100%; border: 1px solid #334155; text-align: center; }
        h2 { font-size: 24px; font-weight: 800; margin-bottom: 5px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; }
        input { width: 93%; padding: 14px; background: #0f172a; border: 1px solid #475569; border-radius: 12px; color: white; font-size: 16px; font-family: inherit; }
        input:focus { outline: none; border-color: #38bdf8; }
        .btn-update { background: #2563eb; color: white; padding: 16px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        .btn-update:hover { background: #1d4ed8; }
        .status-msg { margin-top: 15px; font-size: 14px; font-weight: 600; display: none; padding: 10px; border-radius: 8px; }
        .success { background: rgba(34, 197, 94, 0.2); color: #4ade80; display: block; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>Z Fitness Admin</h2>
        <p>Update Payment Details Below</p>

        <div class="form-group">
            <label for="upiId">Enter New UPI ID</label>
            <input type="text" id="upiId" placeholder="example@oksbi" value="mm05270331@oksbi">
        </div>

        <div class="form-group">
            <label for="oldPrice">Old Price (Ex: 4,999)</label>
            <input type="text" id="oldPrice" placeholder="4,999" value="4,999">
        </div>

        <div class="form-group">
            <label for="newPrice">New Price (Ex: 299)</label>
            <input type="text" id="newPrice" placeholder="299" value="299">
        </div>

        <button class="btn-update" onclick="updatePaymentDetails()">Save & Update Details</button>

        <div id="status" class="status-msg"></div>
    </div>

    <script>
        // ஏற்கனவே சேமித்த விபரங்கள் இருந்தால் அதை லோட் செய்யும்
        window.onload = function() {
            const savedUPI = localStorage.getItem('global_upi_id');
            const savedOldPrice = localStorage.getItem('global_old_price');
            const savedNewPrice = localStorage.getItem('global_new_price');
            
            if(savedUPI) document.getElementById('upiId').value = savedUPI;
            if(savedOldPrice) document.getElementById('oldPrice').value = savedOldPrice;
            if(savedNewPrice) document.getElementById('newPrice').value = savedNewPrice;
        }

        function updatePaymentDetails() {
            const newUPI = document.getElementById('upiId').value.trim();
            const oldPrice = document.getElementById('oldPrice').value.trim();
            const newPrice = document.getElementById('newPrice').value.trim();

            if(newUPI === "" || oldPrice === "" || newPrice === "") {
                alert("Please fill all the fields correctly");
                return;
            }

            // ஃபயர்பேஸிற்கு மாற்றாக தற்காலிகமாக LocalStorage-ல் சேமிக்கிறது
            localStorage.setItem('global_upi_id', newUPI);
            localStorage.setItem('global_old_price', oldPrice);
            localStorage.setItem('global_new_price', newPrice);

            const status = document.getElementById('status');
            status.textContent = "All Details Updated Successfully!";
            status.className = "status-msg success";
            
            setTimeout(() => { status.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>

<style>
:root{ --bg:#eef3f8; --card:#ffffffcc; --border:#d7e0ea; --accent:#007bff; --accent2:#00b894; --text:#1c1c1c; }
body{ margin:0; font-family:'Poppins',Arial,sans-serif; background:var(--bg); color:var(--text); }
*,button,a{transition:0.25s;}

header{ height:60px; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; position:fixed; top:0; left:0; right:0; background:blue; color:white; z-index:10; }
.menu-btn{ position:absolute; left:14px; font-size:26px; background:none; border:none; cursor:pointer; color:white; }

.sidebar{ width:250px; background:#ffffffee; position:fixed; top:0; bottom:0; left:-260px; padding-top:75px; border-right:1px solid var(--border); transition:.35s; backdrop-filter:blur(10px); z-index:20; }
.sidebar.open{left:0;}
.sidebar a{ display:flex; align-items:center; padding:16px 22px; font-size:17px; text-decoration:none; color:var(--text); border-bottom:1px solid #f1f4f6; }
.sidebar a:hover{background:#f8fffd; color:var(--accent); padding-left:28px;}

.main{ position:absolute; top:65px; bottom:65px; left:0; right:0; overflow-y:auto; padding:18px; }
.card{ background:white; padding:20px; border-radius:15px; margin-bottom:15px; box-shadow:0 3px 15px rgba(0,0,0,.1); border: 1px solid var(--border); }
h3{ margin-top:0; color: var(--accent); font-size: 18px; margin-bottom: 15px;}

label{ font-size: 14px; font-weight: 600; color: #555; display: block; margin-bottom: 5px;}
input[type="date"]{ width:100%; padding:12px; margin-bottom:20px; border-radius:10px; border:2px solid var(--border); font-size:16px; outline: none; box-sizing: border-box;}
input[type="date"]:focus{ border-color: var(--accent); }

.status-box{display:flex; justify-content:space-between; margin: 15px 0;}
.status-box button{ width:31%; padding:15px 5px; font-size:14px; font-weight:700; border:none; border-radius:10px; cursor:pointer; opacity: 0.5; }
.yes{background:#00b894;color:white;}
.medium{background:#f1c40f;color:black;}
.no{background:#ff4757;color:white;}
.status-box button.active { opacity: 1; transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: 2px solid #00000022;}

/* Save Button & Spinner */
.save-btn{ width:100%; padding:16px; background:var(--accent); color:white; font-weight:700; border:none; border-radius:12px; font-size:17px; cursor:pointer; margin-top:10px; position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; }
.save-btn:disabled { background: #ccc; cursor: not-allowed; opacity: 0.8; }

.spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.bottom{ height:60px; position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-around; align-items:center; background:#ffffffcc; border-top:1px solid var(--border); backdrop-filter: blur(10px); }
.bottom button{ background:none; border:none; font-size:12px; display:flex; flex-direction:column; align-items:center; opacity:.6; cursor:pointer; font-weight:600; color: #555; }
.bottom button span{font-size:22px;}

.overlay{ position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); display:none; z-index:15; backdrop-filter: blur(2px); }
.overlay.show{display:block;}
</style>
</head>

<body>

<header>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  📥 Log Workout
</header>

<div id="sidebar" class="sidebar">
  <a href="index.html">🏠 Dashboard</a>
  <a href="workouts.html">🔥 Workouts</a>
  <a href="diet.html">🥗 Diet Plans</a>
  <a href="fit tools.html">📋 Fit Tools</a>
  <a href="habit traker.html">♾️ Habit Tracker</a>
  <a href="progress.html">📊 Progress Tracker</a>
  <a href="profile.html">👤 Profile</a>
  <a href="settings.html">⚙️ Settings</a>
</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div class="main">
  <div class="card">
    <h3>🏋️ Workout Tracker</h3>
    
    <label for="logDate">Select Date:</label>
    <input type="date" id="logDate">

    <label>Select Your Status:</label>
    <div class="status-box">
      <button class="yes" id="btnYes" onclick="setTempStatus('✅ Done')">✅ Done</button>
      <button class="medium" id="btnMed" onclick="setTempStatus('🟡 Medium')">🟡 Med</button>
      <button class="no" id="btnNo" onclick="setTempStatus('❌ Missed')">❌ No</button>
    </div>
    
    <button class="save-btn" id="saveBtn" onclick="saveTodayStatus()">
      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">💾 Save Record</span>
    </button>
  </div>
</div>

<div class="bottom">
  <button onclick="location.href='index.html'"><span>🏠</span>Home</button>
  <button onclick="location.href='workouts.html'"><span>🔥</span>Workout</button>
  <button onclick="location.href='diet.html'"><span>🥗</span>Diet</button>
  <button onclick="location.href='profile.html'"><span>👤</span>Profile</button>
</div>

<script>
window.onload = function() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('logDate').value = today;
};

const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

function toggleMenu(){
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
}

const userName = localStorage.getItem("name") || "Guest";

let todayStatus = "";
function setTempStatus(val){ 
    todayStatus = val;
    document.querySelectorAll('.status-box button').forEach(b => b.classList.remove('active'));
    if(val.includes('✅')) document.getElementById('btnYes').classList.add('active');
    if(val.includes('🟡')) document.getElementById('btnMed').classList.add('active');
    if(val.includes('❌')) document.getElementById('btnNo').classList.add('active');
}

async function saveTodayStatus(){
  const saveBtn = document.getElementById("saveBtn");
  const spinner = document.getElementById("btnSpinner");
  const btnText = document.getElementById("btnText");

  if(!todayStatus){ alert("Please select a status!"); return; }

  const selectedDateVal = document.getElementById("logDate").value;
  if(!selectedDateVal){ alert("Please select a date!"); return; }

  // Show loading state
  saveBtn.disabled = true;
  spinner.style.display = "block";
  btnText.innerText = "Saving...";

  const customDate = new Date(selectedDateVal);
  const day = customDate.getDate();
  const monthYear = (customDate.getMonth() + 1) + "_" + customDate.getFullYear();

  if(window.db) {
      try {
          const workoutRef = window.dbRef(window.db, `users/${userName}/logs/${monthYear}/${day}`);
          await window.dbSet(workoutRef, {
              status: todayStatus,
              timestamp: customDate.toISOString()
          });
          
          alert("🔥 Success: Logged as " + todayStatus + " for " + selectedDateVal);
          window.location.href = "index.html"; 
      } catch (e) {
          alert("Error saving status. Please try again.");
          console.error(e);
          // Reset button if error
          saveBtn.disabled = false;
          spinner.style.display = "none";
          btnText.innerText = "💾 Save Record";
      }
  }
}
</script>
</body>
</html>

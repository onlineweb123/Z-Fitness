<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>கலோரி எரிப்பு கணிப்பான்</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans Tamil', sans-serif;
      background-color: #e6f2ff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 255, 0.1);
      width: 90%;
      max-width: 400px;
    }

    h2 {
      color: #0056b3;
      text-align: center;
    }

    p {
      font-size: 14px;
      background-color: #d9eaff;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
      color: #003366;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #b3d1ff;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .result {
      margin-top: 20px;
      font-weight: bold;
      color: #005599;
      text-align: center;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔥 கலோரி எரிப்பு கணிப்பான்</h2>
    <p>📌 <strong>கூற்று:</strong> கலோரி = MET × எடை(kg) × நேரம்(மணிநேரம்)</p>

    <label for="met">MET மதிப்பு:</label>
    <input type="number" id="met" step="0.1" placeholder="உங்கள் MET மதிப்பை உள்ளிடுங்கள்">

    <label for="weight">உடல் எடை (kg):</label>
    <input type="number" id="weight" placeholder="உடல் எடையை உள்ளிடவும்">

    <label for="duration">நேரம் (மணிநேரத்தில்):</label>
    <input type="number" id="duration" step="0.1" placeholder="பயிற்சி நேரத்தை உள்ளிடவும்">

    <button onclick="calculateCalories()">கணக்கிடு</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculateCalories() {
      const met = parseFloat(document.getElementById('met').value);
      const weight = parseFloat(document.getElementById('weight').value);
      const duration = parseFloat(document.getElementById('duration').value);

      const resultDiv = document.getElementById('result');

      if (isNaN(met) || isNaN(weight) || isNaN(duration)) {
        resultDiv.innerText = "❗ தயவுசெய்து அனைத்து தரவுகளையும் சரியாக உள்ளிடுங்கள்.";
        return;
      }

      const calories = met * weight * duration;
      resultDiv.innerText = `✅ நீங்கள் எரித்துள்ள கலோரி: ${calories.toFixed(2)} kcal`;
    }
  </script>
</body>
</html>

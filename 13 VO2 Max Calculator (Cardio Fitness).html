<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VO2 Max Calculator</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans Tamil', sans-serif;
      background-color: #f0f8ff;
      padding: 20px;
      color: #222;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #0077cc;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    input {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background-color: #0077cc;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }
    .result {
      margin-top: 15px;
      text-align: center;
      font-size: 18px;
      color: #008000;
      font-weight: bold;
    }
    .note {
      font-size: 14px;
      margin-top: 10px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>VO2 Max கணிப்பான்</h2>
    <p class="note">🔸 <strong>சூப்பர் டெஸ்ட் (1.5 மைல் ஓட்டம்):</strong><br> VO2max = 483 ÷ நேரம் (நிமிடங்களில்) + 3.5</p>
    
    <label for="time">⏱ ஓட்ட நேரம் (நிமிடங்களில்):</label>
    <input type="number" id="time" placeholder="உங்கள் ஓட்ட நேரத்தை உள்ளிடவும்" step="0.01">

    <button onclick="calculateVO2()">கணக்கிடு</button>

    <div class="result" id="result"></div>

    <p class="note">📌 **குறிப்பு**: இந்தக் கணிப்பு உங்கள் உள்ளார்ந்த கார்டியோ திறனைக் காட்டும். உயர்ந்த மதிப்பானது சிறந்த உடற்பயிற்சி நிலையை குறிக்கும்.</p>
  </div>

  <script>
    function calculateVO2() {
      const time = parseFloat(document.getElementById('time').value);
      const resultDiv = document.getElementById('result');

      if (!time || time <= 0) {
        resultDiv.textContent = 'தயவுசெய்து சரியான ஓட்ட நேரத்தை உள்ளிடவும்!';
        resultDiv.style.color = 'red';
        return;
      }

      const vo2max = (483 / time) + 3.5;
      resultDiv.style.color = '#008000';
      resultDiv.textContent = `உங்கள் VO2 Max: ${vo2max.toFixed(2)} ml/kg/min`;
    }
  </script>
</body>
</html>

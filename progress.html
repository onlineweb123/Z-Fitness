<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAbcluHlCBt5acY5qBwjJgjbSYk7EgeT90",
    authDomain: "z-fitness-a.firebaseapp.com",
    projectId: "z-fitness-a",
    databaseURL: "https://z-fitness-a-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  window.db = database;
  window.dbRef = ref;
  window.dbOnValue = onValue;

  const storedUserName = localStorage.getItem("name");
  const isLoggedIn = localStorage.getItem("isLoggedIn");

  if (isLoggedIn !== "true" || !storedUserName) {
      window.location.href = "login.html";
  } else {
      initTracker(storedUserName);
  }
</script>

<style>
:root{ --bg:#eef3f8; --card:#ffffffcc; --border:#d7e0ea; --accent:#007bff; --accent2:#00b894; --text:#1c1c1c; }
body{ margin:0; font-family:'Poppins',Arial,sans-serif; background:var(--bg); color:var(--text); overflow: hidden; }

header{ height:60px; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; position:fixed; top:0; left:0; right:0; background:blue; color:white; z-index:10; }
.menu-btn{ position:absolute; left:14px; font-size:26px; background:none; border:none; color:white; cursor:pointer; }

.sidebar{ width:250px; background:#ffffffee; position:fixed; top:0; bottom:0; left:-260px; padding-top:75px; border-right:1px solid var(--border); transition:.35s; backdrop-filter:blur(10px); z-index:20; }
.sidebar.open{ left:0; }
.sidebar a{ display:block; padding:16px 22px; font-size:17px; text-decoration:none; color:var(--text); border-bottom:1px solid #f1f4f6; }

.overlay{ position:fixed; inset:0; background:#0008; display:none; backdrop-filter:blur(4px); z-index:15; }
.overlay.show{ display:block; }

.main{ position:absolute; top:65px; bottom:65px; left:0; right:0; overflow-y:auto; padding:18px; }
.card{ padding:18px; background:var(--card); border-radius:18px; box-shadow:0 6px 14px rgba(0,0,0,.08); margin-bottom:16px; border:1px solid var(--border); }

.chart-box{ height:180px; background:#fff; border-radius:12px; border:1px solid var(--border); padding:10px; }
.chart-days{ display:flex; gap:4px; height:100%; align-items:flex-end; }
.chart-bar{ width:10px; border-radius:4px; transition:.3s; }

.future{ background:#cfcfcf; } 
.completed{ background:#007bff; } 
.medium{ background:orange; } 
.missed{ background:red; }

.legend { display: flex; justify-content: space-between; font-size: 11px; margin-top: 10px; }
.legend span { display: flex; align-items: center; gap: 4px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

select { width:100%; padding:12px; border-radius:10px; border:1px solid var(--border); font-size:16px; outline:none; background: white; }

/* Draggable FAB Style */
.fab {
    position: fixed;
    bottom: 80px;
    right: 20px;
    width: 60px;
    height: 60px;
    background-color: var(--accent2);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    text-decoration: none;
    z-index: 1000;
    touch-action: none; /* Prevents scrolling while dragging */
    user-select: none;
    cursor: grab;
}
.fab:active { cursor: grabbing; }

.bottom{ height:60px; position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-around; align-items:center; background:#ffffffcc; border-top:1px solid var(--border); z-index: 10; }
.bottom button{ background:none; border:none; font-size:13px; display:flex; flex-direction:column; align-items:center; opacity:.6; cursor:pointer; }
.bottom button span{ font-size:22px; }
</style>
</head>

<body>

<header>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  📊 Progress Tracker
</header>

<div id="sidebar" class="sidebar">
  <a href="index.html">🏠 Dashboard</a>
  <a href="workouts.html">🔥 Workouts</a>
  <a href="diet.html">🥗 Diet Plans</a>
  <a href="fit tools.html">📋 Fit Tools</a>
  <a href="habit traker.html">♾️ Habit Traker</a>
  <a href="progress.html">📊 Progress Tracker</a>
  <a href="profile.html">👤 Profile</a>
  <a href="#" onclick="logout()">🚪 Logout</a>
</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<div id="draggableFab" class="fab" onclick="goToStatus(event)">
  <span>📝</span>
</div>

<div class="main">
  <div class="card">
    <p style="margin-top:0; color: #666;">Name: <b id="displayUser">--</b></p>
    <h3>📅 Select Month</h3>
    <select id="monthSelect" onchange="handleMonthChange()"></select>
  </div>

  <div class="card">
    <h3 id="chartTitle">📈 Workout Status</h3>
    <div class="chart-box">
      <div class="chart-days" id="daysChart"></div>
    </div>
    <div class="legend">
        <span><i class="dot completed"></i> Done</span>
        <span><i class="dot medium"></i> Half</span>
        <span><i class="dot missed"></i> Missed</span>
        <span><i class="dot future"></i> Future</span>
    </div>
  </div>
</div>

<div class="bottom">
  <button onclick="location.href='index.html'"><span>🏠</span>Home</button>
  <button onclick="location.href='workouts.html'"><span>🔥</span>Workout</button>
  <button onclick="location.href='diet.html'"><span>🥗</span>Diet</button>
  <button onclick="location.href='profile.html'"><span>👤</span>Profile</button>
</div>

<script>
// --- Draggable FAB Logic ---
const fab = document.getElementById("draggableFab");
let isDragging = false;
let startX, startY, initialX, initialY;

// நகர்த்தும் வசதி (Touch & Mouse)
const onStart = (e) => {
    isDragging = false; 
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    
    startX = clientX;
    startY = clientY;
    
    const rect = fab.getBoundingClientRect();
    initialX = rect.left;
    initialY = rect.top;

    document.addEventListener(e.type.includes('touch') ? 'touchmove' : 'mousemove', onMove);
    document.addEventListener(e.type.includes('touch') ? 'touchend' : 'mouseup', onEnd);
};

const onMove = (e) => {
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    
    const dx = clientX - startX;
    const dy = clientY - startY;

    // ஒரு 5 பிக்சலுக்கு மேல் நகர்ந்தால் மட்டுமே அது "Drag" எனக் கருதப்படும்
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
        isDragging = true;
    }

    if (isDragging) {
        let newX = initialX + dx;
        let newY = initialY + dy;

        // ஸ்க்ரீன் எல்லைக்குள் பட்டனை வைப்பதற்கான கட்டுப்பாடு
        newX = Math.max(10, Math.min(newX, window.innerWidth - 70));
        newY = Math.max(70, Math.min(newY, window.innerHeight - 130));

        fab.style.left = `${newX}px`;
        fab.style.top = `${newY}px`;
        fab.style.right = 'auto';
        fab.style.bottom = 'auto';
    }
};

const onEnd = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
};

fab.addEventListener('mousedown', onStart);
fab.addEventListener('touchstart', onStart, {passive: true});

// பட்டனை கிளிக் செய்தால் லிங்க் போவதற்கான பங்க்ஷன்
function goToStatus(e) {
    if (!isDragging) {
        window.location.href = "workout status.html";
    }
}

// --- முந்தைய லாஜிக் ---
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
}

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

let currentUserName = "";

function initTracker(userName) {
    currentUserName = userName;
    document.getElementById("displayUser").innerText = userName;
    
    const profileRef = window.dbRef(window.db, `users/${userName}/profile`);
    window.dbOnValue(profileRef, (snap) => {
        const data = snap.val();
        if(data && data.status === "Expired") {
            window.location.href = "payment.html";
            return;
        }
        loadAvailableMonths();
    });
}

function loadAvailableMonths() {
    const logsRef = window.dbRef(window.db, `users/${currentUserName}/logs`);
    window.dbOnValue(logsRef, (snap) => {
        const allLogs = snap.val();
        const select = document.getElementById("monthSelect");
        select.innerHTML = "";

        const now = new Date();
        const currentMonthKey = (now.getMonth() + 1) + "_" + now.getFullYear();

        let currentOpt = document.createElement("option");
        currentOpt.value = currentMonthKey;
        currentOpt.textContent = "Current Month (" + currentMonthKey.replace("_", "/") + ")";
        select.appendChild(currentOpt);

        if(allLogs) {
            Object.keys(allLogs).sort().reverse().forEach(key => {
                if(key !== currentMonthKey) {
                    let opt = document.createElement("option");
                    opt.value = key;
                    opt.textContent = key.replace("_", "/");
                    select.appendChild(opt);
                }
            });
        }
        handleMonthChange();
    });
}

function handleMonthChange() {
    const monthKey = document.getElementById("monthSelect").value;
    const [m, y] = monthKey.split("_");
    const logRef = window.dbRef(window.db, `users/${currentUserName}/logs/${monthKey}`);

    window.dbOnValue(logRef, (snap) => {
        const monthData = snap.val() || {};
        const container = document.getElementById("daysChart");
        container.innerHTML = "";

        const totalDays = new Date(parseInt(y), parseInt(m), 0).getDate();
        const now = new Date();
        const isCurrentMonth = (now.getMonth() + 1 == m) && (now.getFullYear() == y);
        const todayDate = now.getDate();

        for(let i = 1; i <= totalDays; i++) {
            let bar = document.createElement("div");
            bar.classList.add("chart-bar");
            const dayStatus = monthData[i] ? monthData[i].status : "";

            if(isCurrentMonth && i > todayDate) {
                bar.classList.add("future");
                bar.style.height = "15%";
            } else if(dayStatus.includes("✅")) {
                bar.classList.add("completed");
                bar.style.height = "100%";
            } else if(dayStatus.includes("🟡")) {
                bar.classList.add("medium");
                bar.style.height = "60%";
            } else if(dayStatus.includes("❌")) {
                bar.classList.add("missed");
                bar.style.height = "35%";
            } else {
                bar.classList.add("future");
                bar.style.height = "10%";
            }
            container.appendChild(bar);
        }
    });
}
</script>
</body>
</html>
